[build-system]
requires = [
    "ninja",
    "packaging",
    "setuptools",
    "torch >= 2.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm"
# uv reads this without running setup.py. Keep in sync with vllm/__init__.py.
version = "0.1.3"
# Matches the Python version used by this repo's CI (.github/workflows).
requires-python = "==3.10.*"
# Keep in sync with requirements.txt.
dependencies = [
    "ninja",  # For faster builds.
    "psutil",
    "ray >= 2.5.1",
    "sentencepiece",  # Required for LLaMA tokenizer.
    "numpy",
    "torch >= 2.0.0",
    "transformers >= 4.31.0",  # Required for LLaMA-2.
    "xformers >= 0.0.19",
    "fastapi",
    "uvicorn",
    "pydantic < 2",  # Required for OpenAI server.
]
# The remaining metadata still comes from setup.py.
dynamic = ["description", "readme", "license", "authors", "classifiers", "urls"]

# Installed by default with `uv sync`; skip it with `uv sync --no-dev`.
# Keep in sync with requirements-dev.txt.
[dependency-groups]
dev = [
    "yapf==0.32.0",
    "pylint==2.8.2",
    "mypy==0.991",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
    "pytest",
    # pylint 2.8.2 imports pkg_resources, which newer setuptools no longer ships.
    "setuptools < 81",
]

[tool.uv]
# setup.py needs nvcc (CUDA_HOME) and imports torch to compile the CUDA kernels,
# so `uv sync` only installs dependencies. Build the kernels separately:
#   uv pip install --no-build-isolation -e .
# and then use `uv sync --inexact` so the editable install is kept.
package = false
# vLLM only supports Linux + CUDA; skip resolving for other platforms.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
